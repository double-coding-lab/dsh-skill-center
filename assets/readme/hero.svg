    <rect x="700" y="146" width="408" height="30" rx="9" fill="#0C1014" stroke="#242A32"/>
    <circle cx="716" cy="161" r="5" fill="none" stroke="#6F7884" stroke-width="1.4"/>
    <line x1="720" y1="165" x2="724" y2="169" stroke="#6F7884" stroke-width="1.4" stroke-linecap="round"/>
