    <circle cx="1096" cy="88" r="14" fill="#FFFFFF"/>
    <path d="M1096 82v12M1090 88h12" stroke="#11151A" stroke-width="1.6" stroke-linecap="round"/>

    <rect x="700" y="112" width="70" height="26" rx="13" fill="#22282F"/>
