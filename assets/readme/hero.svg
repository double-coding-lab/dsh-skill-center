<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="hero-title hero-desc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="hero-title">dsh-skill-center — DeepSeek Harness 的本机技能管理器</title>
  <desc id="hero-desc">在 DeepSeek Harness 侧栏查看、启停、创建、上传技能，并从 ClawHub 安装。</desc>

  <defs>
    <linearGradient id="glow-a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2A2A"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="glow-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17202B"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="26" fill="#0B0D10"/>
  <circle cx="110" cy="30" r="220" fill="url(#glow-a)" opacity=".5"/>
  <circle cx="1130" cy="400" r="240" fill="url(#glow-b)" opacity=".55"/>

  <g id="title-block">
    <text x="64" y="86" fill="#7F8996" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="2">DEEPSEEK HARNESS · SKILL PLUGIN</text>
    <text x="64" y="166" fill="#F7F8FA" font-size="58" font-weight="700" letter-spacing="-1">dsh-skill-center</text>
